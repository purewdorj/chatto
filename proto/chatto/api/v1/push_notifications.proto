syntax = "proto3";

package chatto.api.v1;

import "buf/validate/validate.proto";

// Push notification device commands for the authenticated user. Browsers
// register Web Push subscriptions. Native mobile apps register APNs or FCM
// device tokens.
service PushNotificationService {
  // Stores or updates the caller's browser push subscription.
  //
  // The server must have Web Push configured. Clients normally call this after
  // the browser grants notification permission and returns a PushSubscription.
  // A stored subscription expires 180 days after its most recent save. The
  // client owns the refresh: call Subscribe again when the app starts and at
  // least once a day while it runs, and when the browser replaces the
  // PushSubscription. The server removes expired records itself. Call
  // Unsubscribe to stop delivery before the subscription expires.
  rpc Subscribe(SubscribeRequest) returns (SubscribeResponse);

  // Removes the caller's browser push subscription by endpoint.
  //
  // The call is idempotent: removing an unknown endpoint still succeeds.
  rpc Unsubscribe(UnsubscribeRequest) returns (UnsubscribeResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // Sends a test notification to the caller's registered browser
  // subscriptions and native devices. Calls are rate-limited per account.
  // The call succeeds when at least one device accepts the notification.
  // Delivery failures return a generic unavailable error without exposing the
  // push provider's response body.
  rpc SendTestNotification(SendTestNotificationRequest) returns (SendTestNotificationResponse);

  // Stores or updates the caller's native mobile push device.
  //
  // The server must deliver to the requested platform. Read
  // ServerRuntimeConfig.native_push_platforms to find the platforms that the
  // server supports; the call fails with FAILED_PRECONDITION for other
  // platforms. The app_id must be an app identifier that the server operator
  // allows; the call fails with INVALID_ARGUMENT for other identifiers.
  //
  // A stored device expires 180 days after its most recent save. The client
  // owns the refresh: call RegisterNativeDevice again when the app starts, at
  // least once a day while it runs, and when the operating system issues a
  // new token. The server removes expired devices itself, and it removes a
  // device when the push service reports that the token is no longer valid.
  // A device token is active for only the account that most recently
  // registered it. Call UnregisterNativeDevice to stop delivery before the
  // device expires.
  //
  // Native push sends notification content to Apple or Google in clear text.
  // The server operator can configure the server to omit message previews.
  rpc RegisterNativeDevice(RegisterNativeDeviceRequest) returns (RegisterNativeDeviceResponse);

  // Removes the caller's native push device by device token.
  //
  // The call is idempotent: removing an unknown token still succeeds. The call
  // succeeds also when the server no longer delivers native push.
  rpc UnregisterNativeDevice(UnregisterNativeDeviceRequest) returns (UnregisterNativeDeviceResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

// Push service of a native mobile push device.
enum NativePushPlatform {
  // Not set. Requests with this value fail.
  NATIVE_PUSH_PLATFORM_UNSPECIFIED = 0;
  // Apple Push Notification service (APNs), used by iOS and iPadOS apps.
  NATIVE_PUSH_PLATFORM_APNS = 1;
  // Firebase Cloud Messaging (FCM), used by Android apps.
  NATIVE_PUSH_PLATFORM_FCM = 2;
  // APNs VoIP pushes through PushKit, used by iOS apps to ring incoming calls
  // through CallKit. The server sends only call pushes to these devices:
  // kind "call" when a call rings the account, and kind "call_end" when that
  // ring stops. The app must report every VoIP push to CallKit, also a
  // "call_end" push for a call that it does not know. Use the PushKit token,
  // the bundle ID as app_id, and the same apns_sandbox rules as APNS. The
  // server sends to the APNs topic "<app_id>.voip". The server includes this
  // value in native_push_platforms when it delivers through APNs.
  NATIVE_PUSH_PLATFORM_APNS_VOIP = 3;
}

// Request to store a native mobile push device.
message RegisterNativeDeviceRequest {
  // Push service that delivers to the device.
  NativePushPlatform platform = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  // Device token from the operating system: the APNs device token or the
  // PushKit VoIP token as hex, or the FCM registration token.
  string token = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 4096
  }];

  // App identifier: the iOS bundle ID for APNs and APNs VoIP, or the Android
  // package name for FCM.
  string app_id = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];

  // True when the APNs token belongs to the APNs development (sandbox)
  // environment, for example a debug build. It applies to APNs and APNs VoIP
  // tokens. The server ignores it for FCM.
  bool apns_sandbox = 4;

  // Optional device name for device identification.
  optional string device_name = 5 [(buf.validate.field).string.max_len = 128];

  // Random per-save capability generated by the client. A cancelled save can
  // later remove only the device record carrying this exact token, through
  // chatto.auth.v1.PushSubscriptionCleanupService.DeleteNativeDevice.
  string cleanup_token = 6 [(buf.validate.field).string = {
    min_len: 32
    max_len: 128
  }];
}

// Response from storing a native mobile push device.
message RegisterNativeDeviceResponse {}

// Request to remove a native mobile push device.
message UnregisterNativeDeviceRequest {
  // Device token to remove.
  string token = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 4096
  }];
}

// Response from removing a native mobile push device.
message UnregisterNativeDeviceResponse {}

// Request to store a PushSubscription returned by the browser Push API.
message SubscribeRequest {
  // Absolute HTTPS push service endpoint URL. The server rejects redirects and
  // destinations that resolve to private or other special-use addresses.
  string endpoint = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 4096
  }];

  // Client P-256 ECDH public key from PushSubscription.keys.p256dh.
  string p256dh = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];

  // Authentication secret from PushSubscription.keys.auth.
  string auth = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];

  // Optional browser user-agent string for device identification.
  optional string user_agent = 4 [(buf.validate.field).string.max_len = 512];

  // URL host of the Chatto server that supplied the installed web app. The
  // sending server combines this with its own hostname to reconstruct the
  // client route. A host can include a port but no scheme, path, or user info.
  string client_host = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];

  // Random per-save capability generated by the client. A cancelled save can
  // later remove only the record carrying this exact token, even when the same
  // browser PushSubscription has since moved to another account.
  string cleanup_token = 6 [(buf.validate.field).string = {
    min_len: 32
    max_len: 128
  }];
}

// Response from storing a browser push subscription.
message SubscribeResponse {
  reserved 1;
  reserved "subscribed";
}

// Request to remove a browser push subscription.
message UnsubscribeRequest {
  // Push service endpoint URL to remove.
  string endpoint = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 4096
  }];
}

// Response from removing a browser push subscription.
message UnsubscribeResponse {
  reserved 1;
  reserved "unsubscribed";
}

// Request to test the current user's registered browser push subscriptions.
message SendTestNotificationRequest {}

// Result of sending a test Web Push notification.
message SendTestNotificationResponse {
  reserved 1;
  reserved "sent";
}
